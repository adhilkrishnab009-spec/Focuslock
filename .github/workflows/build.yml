name: Build FocusLock
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write project files
        run: |
          mkdir -p proj/app/src/main/java/com/example/focuslock proj/app/src/main/res/xml proj/app/src/main/res/values
          cd proj
          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "FocusLock"
          include(":app")
          EOF
          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
          EOF
          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.example.focuslock"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.example.focuslock"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <!-- Lets the service read other apps' categories (Social / Video / Game) -->
              <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES" />

              <application
                  android:label="FocusLock"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">

                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".BlockerService"
                      android:exported="true"
                      android:label="FocusLock"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/blocker_service" />
                  </service>
              </application>
          </manifest>
          EOF
          cat > app/src/main/res/xml/blocker_service.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:canRetrieveWindowContent="false"
              android:notificationTimeout="100"
              android:description="@string/service_desc" />
          EOF
          cat > app/src/main/res/values/focus_strings.xml <<'EOF'
          <resources>
              <string name="service_desc">Detects which app is open so FocusLock can send you home from social and entertainment apps while a focus timer is running. It does not read your screen content.</string>
          </resources>
          EOF
          cat > app/src/main/java/com/example/focuslock/BlockerService.kt <<'EOF'
          package com.example.focuslock

          import android.accessibilityservice.AccessibilityService
          import android.content.Context
          import android.content.pm.ApplicationInfo
          import android.view.accessibility.AccessibilityEvent
          import android.widget.Toast

          object Focus {
              private const val KEY_END = "end_at"
              private val cache = HashMap<String, Boolean>()

              // Apps that don't declare a category, blocked by package name. Add more here.
              private val ALWAYS_BLOCK = setOf(
                  "com.instagram.android", "com.zhiliaoapp.musically", "com.ss.android.ugc.trill",
                  "com.google.android.youtube", "com.facebook.katana", "com.twitter.android",
                  "com.snapchat.android", "com.reddit.frontpage", "com.netflix.mediaclient",
                  "tv.twitch.android.app", "com.pinterest", "com.discord",
                  "com.disney.disneyplus", "com.amazon.avod.thirdpartyclient"
              )

              // Packages to never block, e.g. "com.whatsapp" if you want messaging to keep working.
              private val ALWAYS_ALLOW = emptySet<String>()

              private fun prefs(c: Context) = c.getSharedPreferences("focus", Context.MODE_PRIVATE)

              fun endAt(c: Context) = prefs(c).getLong(KEY_END, 0L)

              fun isActive(c: Context) = System.currentTimeMillis() < endAt(c)

              fun start(c: Context, minutes: Int) {
                  prefs(c).edit().putLong(KEY_END, System.currentTimeMillis() + minutes * 60_000L).apply()
              }

              fun minutesLeft(c: Context) = (endAt(c) - System.currentTimeMillis()) / 60_000 + 1

              fun shouldBlock(c: Context, pkg: String): Boolean = cache.getOrPut(pkg) {
                  when {
                      pkg == c.packageName || pkg in ALWAYS_ALLOW -> false
                      pkg in ALWAYS_BLOCK -> true
                      else -> try {
                          when (c.packageManager.getApplicationInfo(pkg, 0).category) {
                              ApplicationInfo.CATEGORY_SOCIAL,
                              ApplicationInfo.CATEGORY_VIDEO,
                              ApplicationInfo.CATEGORY_GAME -> true
                              else -> false
                          }
                      } catch (e: Exception) { false }
                  }
              }
          }

          class BlockerService : AccessibilityService() {
              private var lastToast = 0L

              override fun onAccessibilityEvent(event: AccessibilityEvent) {
                  if (event.eventType != AccessibilityEvent.TYPE_WINDOW_STATE_CHANGED) return
                  val pkg = event.packageName?.toString() ?: return
                  if (!Focus.isActive(this) || !Focus.shouldBlock(this, pkg)) return

                  performGlobalAction(GLOBAL_ACTION_HOME)

                  val now = System.currentTimeMillis()
                  if (now - lastToast > 2000) {
                      lastToast = now
                      Toast.makeText(this, "Focus on: ${Focus.minutesLeft(this)} min left", Toast.LENGTH_SHORT).show()
                  }
              }

              override fun onInterrupt() {}
          }
          EOF
          cat > app/src/main/java/com/example/focuslock/MainActivity.kt <<'EOF'
          package com.example.focuslock

          import android.app.Activity
          import android.content.Intent
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.provider.Settings
          import android.text.InputType
          import android.view.Gravity
          import android.view.View
          import android.widget.Button
          import android.widget.EditText
          import android.widget.LinearLayout
          import android.widget.TextView

          class MainActivity : Activity() {
              private val handler = Handler(Looper.getMainLooper())
              private lateinit var countdown: TextView
              private lateinit var status: TextView
              private lateinit var minutes: EditText
              private lateinit var start: Button
              private lateinit var enable: Button

              private fun dp(v: Int) = (v * resources.displayMetrics.density).toInt()

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(dp(24), dp(72), dp(24), dp(24))
                  }
                  countdown = TextView(this).apply { textSize = 56f; gravity = Gravity.CENTER }
                  status = TextView(this).apply {
                      textSize = 16f
                      gravity = Gravity.CENTER
                      setPadding(0, dp(8), 0, dp(32))
                  }
                  minutes = EditText(this).apply {
                      inputType = InputType.TYPE_CLASS_NUMBER
                      setText("30")
                      textSize = 24f
                      gravity = Gravity.CENTER
                  }
                  val presets = LinearLayout(this).apply {
                      for (m in listOf(15, 30, 60, 90)) {
                          addView(Button(this@MainActivity).apply {
                              text = "$m"
                              setOnClickListener { minutes.setText("$m") }
                          }, LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f))
                      }
                  }
                  start = Button(this).apply {
                      text = "Start focus (minutes)"
                      setOnClickListener {
                          val m = minutes.text.toString().toIntOrNull()?.coerceIn(1, 240)
                              ?: return@setOnClickListener
                          Focus.start(this@MainActivity, m)
                          refresh()
                      }
                  }
                  enable = Button(this).apply {
                      text = "Turn on blocking permission"
                      setOnClickListener { startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS)) }
                  }

                  listOf(countdown, status, minutes, presets, start, enable).forEach { root.addView(it) }
                  setContentView(root)
              }

              private val tick = object : Runnable {
                  override fun run() { refresh(); handler.postDelayed(this, 1000) }
              }

              override fun onResume() { super.onResume(); tick.run() }
              override fun onPause() { super.onPause(); handler.removeCallbacks(tick) }

              private fun permissionGranted(): Boolean {
                  val enabled = Settings.Secure.getString(
                      contentResolver, Settings.Secure.ENABLED_ACCESSIBILITY_SERVICES
                  ) ?: return false
                  return enabled.contains("$packageName/") && enabled.contains("BlockerService")
              }

              private fun refresh() {
                  val left = Focus.endAt(this) - System.currentTimeMillis()
                  val on = left > 0
                  val granted = permissionGranted()

                  countdown.text = if (on) "%d:%02d".format(left / 60000, left / 1000 % 60) else "--:--"
                  status.text = when {
                      !granted -> "Blocking permission is off"
                      on -> "Social, video and game apps are locked"
                      else -> "Pick a duration to lock distracting apps"
                  }
                  start.isEnabled = granted && !on
                  minutes.isEnabled = !on
                  enable.visibility = if (granted) View.GONE else View.VISIBLE
              }
          }
          EOF
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
      - run: gradle assembleDebug --no-daemon
        working-directory: proj
      - run: gh release create "build-${{ github.run_number }}" proj/app/build/outputs/apk/debug/app-debug.apk --title "FocusLock build ${{ github.run_number }}" --notes "Debug build"
        env:
          GH_TOKEN: ${{ github.token }}
